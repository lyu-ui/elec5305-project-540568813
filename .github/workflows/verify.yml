name: Verify research project
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/requirements-analysis.txt
      - name: Install analysis dependencies
        run: python -m pip install -r python/requirements-analysis.txt
      - name: Verify fixed inputs and evaluation logic
        run: python python/verify_project.py
  matlab:
    name: Execute MATLAB entry point
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements-analysis.txt
      - name: Prepare independently verified reference inputs
        run: |
          python -m pip install -r python/requirements-analysis.txt
          python python/setup_project.py
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
      - name: Execute and compare MATLAB results
        uses: matlab-actions/run-command@v3
        with:
          command: diary('matlab_ci.log'); R = run_project(false,false); assert(height(R.meta)==33); assert(height(R.frames)==21494); disp('RUN_PROJECT_CI_PASSED'); diary off
      - name: Independently audit all four MATLAB tables
        run: python python/audit_matlab_results.py
      - name: Retain execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-execution-evidence
          path: |
            matlab_ci.log
            matlab_results/MATLAB_VERIFICATION.txt
            matlab_results/selective_by_clip.csv
            matlab_results/wiener_trials.csv
            matlab_results/lpc_control.csv
